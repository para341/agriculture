spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xueye_warn?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456  # 替换为你的MySQL密码
  devtools:
    restart:
      enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xueye.xueyeWarn.bean
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8

hikari:
  maximum-pool-size: 20        # 最大连接池数量
  minimum-idle: 5              # 最小空闲连接数
  connection-timeout: 30000    # 连接超时时间（毫秒）
  idle-timeout: 600000         # 空闲超时时间（毫秒）
  max-lifetime: 1800000        # 连接最大生命周期（毫秒）
  leak-detection-threshold: 60000 # 连接泄漏检测阈值（毫秒）

# 【新增】开启MyBatis SQL日志
logging:
  level:
    com.xueye.xueyeWarn.mapper: debug  # 替换为你的Mapper接口包路径（如StudentMapper所在的包）
